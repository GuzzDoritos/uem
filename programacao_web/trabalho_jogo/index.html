<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kingdom of Loathing — Protótipo Web</title>
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="data/bundle.js"></script>
  <script defer src="js/dataLoader.js"></script>
  <script defer src="js/state.js"></script>
  <script defer src="js/inventory.js"></script>
  <script defer src="js/combat.js"></script>
  <script defer src="js/events.js"></script>
  <script defer src="js/art.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body class="is-title">
  <aside id="char-pane" class="charpane" aria-label="Status do Personagem">
    <div id="char-avatar" class="char-avatar"></div>
    <div id="char-name" class="char-name">Aventureiro</div>
    <div id="char-level" class="char-level">Level 1</div>
    <div class="stat-bar level-bar" title="Progresso para o próximo nível">
      <div id="level-bar-fill" class="stat-bar-fill"></div>
    </div>
    <div id="char-class" class="char-class">Sem Classe</div>

    <table class="char-stats">
      <tr>
        <td class="stat-lbl">Muscle:</td>
        <td class="stat-val">
          <span id="stat-muscle">0</span>
          <div class="stat-bar"><div id="substat-muscle-fill" class="stat-bar-fill"></div></div>
        </td>
      </tr>
      <tr>
        <td class="stat-lbl">Mysticality:</td>
        <td class="stat-val">
          <span id="stat-mysticality">0</span>
          <div class="stat-bar"><div id="substat-mysticality-fill" class="stat-bar-fill"></div></div>
        </td>
      </tr>
      <tr>
        <td class="stat-lbl">Moxie:</td>
        <td class="stat-val">
          <span id="stat-moxie">0</span>
          <div class="stat-bar"><div id="substat-moxie-fill" class="stat-bar-fill"></div></div>
        </td>
      </tr>
    </table>

    <table class="char-resources">
      <tr>
        <td>
          <div id="icon-hp"></div>
          <div id="res-hp" class="res-num">0 / 0</div>
        </td>
        <td>
          <div id="icon-mp"></div>
          <div id="res-mp" class="res-num">0 / 0</div>
        </td>
      </tr>
      <tr>
        <td>
          <div id="icon-meat"></div>
          <div id="res-meat" class="res-num">0</div>
        </td>
        <td>
          <div id="icon-adv"></div>
          <div id="res-adv" class="res-num">0</div>
        </td>
      </tr>
    </table>

    <div class="char-section">
      <strong>Current Quest:</strong>
      <div id="char-quest">-</div>
    </div>

    <div class="char-section">
      <strong>Last Adventure:</strong>
      <div>
        <button type="button" id="btn-last-adventure" class="link" data-action="explore" data-id="" disabled>(nenhuma)</button>
      </div>
    </div>

    <div class="char-section">
      <strong>Score:</strong>
      <div id="char-score">0</div>
    </div>
  </aside>

  <header id="top-pane" class="toppane">
    <nav class="top-nav" aria-label="Menu Principal">
      <button type="button" class="nav-link" data-action="nav" data-view="map" title="Mapa (M)">
        <span class="nav-icon" data-nav-icon="map"></span>
        <span class="nav-label">mapa</span>
      </button>
      <button type="button" class="nav-link" data-action="nav" data-view="inventory" title="Inventário (I)">
        <span class="nav-icon" data-nav-icon="inventory"></span>
        <span class="nav-label">inventário</span>
      </button>
      <button type="button" class="nav-link" data-action="nav" data-view="crafting" title="Crafting (C)">
        <span class="nav-icon" data-nav-icon="crafting"></span>
        <span class="nav-label">crafting</span>
      </button>
      <button type="button" class="nav-link" data-action="nav" data-view="camp" title="Acampamento (R)">
        <span class="nav-icon" data-nav-icon="camp"></span>
        <span class="nav-label">acampamento</span>
      </button>
      <button type="button" class="nav-link" data-action="help" data-view="help" title="Ajuda e Controles (H / Esc)">
        <span class="nav-icon" data-nav-icon="help"></span>
        <span class="nav-label">ajuda</span>
      </button>
      <button type="button" class="nav-link" data-action="restart" title="Reiniciar Partida">
        <span class="nav-icon" data-nav-icon="restart"></span>
        <span class="nav-label">reiniciar</span>
      </button>
    </nav>
    <div id="moons-slot"></div>
  </header>

  <main id="main-pane" class="mainpane">
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <div id="view" class="view"></div>
  </main>
</body>
</html>
